type: chiller
model: HANBELL_310_410
register_type: holding
description: >
  First Enterprise Hanbell 310/410 model with complete Talos-readable register
  coverage. Compressor status points are driven dynamically by SimulationWorld;
  all other readable points are stable hold values so Talos bulk reads remain
  valid while the chiller is stopped or running.

pins:
  # Water temperatures: raw values use the Talos driver's 0.1 degC scale.
  - name: CHILLED_WATER_TEMP_IN
    offset: 55
    register_type: holding
    value: 150
    profile: { type: hold }

  - name: CHILLED_WATER_TEMP_OUT
    offset: 56
    register_type: holding
    value: 100
    profile: { type: hold }

  - name: COOLING_WATER_TEMP_IN
    offset: 57
    register_type: holding
    value: 300
    profile: { type: hold }

  - name: COOLING_WATER_TEMP_OUT
    offset: 58
    register_type: holding
    value: 350
    profile: { type: hold }

  # Sequence confirmation points. SimulationWorld overwrites these values.
  - name: COMP1_STATUS
    offset: 101
    register_type: holding
    value: 0
    profile: { type: hold }

  - name: COMP2_STATUS
    offset: 102
    register_type: holding
    value: 0
    profile: { type: hold }

  # Read-only operating-mode feedback. Keep neutral unless a scenario needs it.
  - name: LOCAL_MODE
    offset: 2710
    register_type: coil
    value: 0
    profile: { type: hold }

  - name: REMOTE_MODE
    offset: 2810
    register_type: coil
    value: 0
    profile: { type: hold }

  # EM330 data relayed through the same Hanbell PLC. These are fixed placeholders
  # for Talos read coverage; AverageVoltage/AverageCurrent are computed by Talos.
  - name: V_RS
    offset: 6307
    register_type: holding
    value: 3800
    profile: { type: hold }

  - name: V_ST
    offset: 6309
    register_type: holding
    value: 3800
    profile: { type: hold }

  - name: V_TR
    offset: 6311
    register_type: holding
    value: 3800
    profile: { type: hold }

  - name: Phase_A_Current
    offset: 6513
    register_type: holding
    value: 0
    profile: { type: hold }

  - name: Phase_B_Current
    offset: 6515
    register_type: holding
    value: 0
    profile: { type: hold }

  - name: Phase_C_Current
    offset: 6517
    register_type: holding
    value: 0
    profile: { type: hold }

  - name: Kw
    offset: 6541
    register_type: holding
    value: 0
    profile: { type: hold }

  - name: AveragePowerFactor
    offset: 6554
    register_type: holding
    value: 0
    profile: { type: hold }

  # Talos reads Kwh as u32_be. The simulator currently only needs a neutral zero;
  # type:uint32 reserves both words (6556/6557). Zero has identical representation
  # in either word order, so no endian ambiguity is introduced.
  - name: Kwh
    offset: 6556
    register_type: holding
    type: uint32
    value: 0
    profile: { type: hold }
