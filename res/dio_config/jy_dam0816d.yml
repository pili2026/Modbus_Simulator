type: io_module
model: JY_DAM0816D
register_type: discrete
interval_sec: 0.2

description: >
  JY-DAM0816D simulation model with 16 discrete inputs and 8 coil outputs.
  DI pins use HOLD so the plant behavior layer or an external Modbus master can
  own their values without the profile updater overwriting them.

pins:
