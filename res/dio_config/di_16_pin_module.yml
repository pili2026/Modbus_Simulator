type: io_module
model: 16_Pin_DI
register_type: holding
interval_sec: 0.5

description: >
  Simulates a 16-channel Digital Input (DI) module.
  Each pin can be configured with different profile types:
  - constant: always ON or OFF
  - toggle: flip ON/OFF at fixed interval
  - pulse: ON for high_time seconds, OFF for low_time seconds

pins:
  - name: DIn01
    offset: 0
    profile:
      type: constant
      value: 1

  - name: DIn02
    offset: 1
    profile:
      type: constant
      value: 0

  - name: DIn03
    offset: 2
    profile:
      type: toggle
      interval: 2

  - name: DIn04
    offset: 3
    profile:
      type: toggle
      interval: 5

  - name: DIn05
    offset: 4
    profile:
      type: pulse
      high_time: 3
      low_time: 7

  - name: DIn06
    offset: 5
    profile:
      type: pulse
      high_time: 1
      low_time: 1

  - name: DIn07
    offset: 6
    profile:
      type: constant
      value: 1

  - name: DIn08
    offset: 7
    profile:
      type: toggle
      interval: 1

  - name: DIn09
    offset: 8
    profile:
      type: toggle
      interval: 10

  - name: DIn10
    offset: 9
    profile:
      type: pulse
      high_time: 2
      low_time: 4

  - name: DIn11
    offset: 10
    profile:
      type: pulse
      high_time: 5
      low_time: 2

  - name: DIn12
    offset: 11
    profile:
      type: constant
      value: 0

  - name: DIn13
    offset: 12
    profile:
      type: toggle
      interval: 3

  - name: DIn14
    offset: 13
    profile:
      type: constant
      value: 1

  - name: DIn15
    offset: 14
    profile:
      type: pulse
      high_time: 6
      low_time: 6

  - name: DIn16
    offset: 15
    profile:
      type: toggle
      interval: 0.5
